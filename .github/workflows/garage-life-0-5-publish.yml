name: Publish GARAGE LIFE 0.5 at /67

on:
  push:
    paths:
      - '.github/workflows/garage-life-0-5-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garage-life-67-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download exact verified game build
        env:
          GAME_ZIP_URL: 'https://at.adobe.com/gZSUVPBT2XMRaJ9R'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 240 "$GAME_ZIP_URL" -o /tmp/garage-life-0.5.zip
          echo 'e6f70e03f7a2fb291e3554fda6196c962fcd9d489a98c351ca4d8094f028d1f7  /tmp/garage-life-0.5.zip' | sha256sum --check

      - name: Replace ONLY /67 with verified build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil, stat
          archive = Path('/tmp/garage-life-0.5.zip')
          dest = Path('67')
          with ZipFile(archive) as zip_file:
              entries = [item for item in zip_file.infolist() if not item.is_dir()]
              names = {item.filename for item in entries}
              required = {'index.html','style.css','js/main.js','js/world.js',
                          'vendor/three/build/three.module.js',
                          'assets/kenney/workbench.glb',
                          'assets/pbr/garage_tile_normal.png'}
              assert required.issubset(names), f'Missing required game files: {required - names}'
              assert len(entries) < 150 and sum(x.file_size for x in entries) < 50_000_000
              for entry in entries:
                  name = PurePosixPath(entry.filename)
                  assert not name.is_absolute() and '..' not in name.parts
                  assert not stat.S_ISLNK(entry.external_attr >> 16)
              if dest.exists(): shutil.rmtree(dest)
              dest.mkdir()
              for entry in entries:
                  target = dest.joinpath(*PurePosixPath(entry.filename).parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zip_file.open(entry) as src, target.open('wb') as dst:
                      shutil.copyfileobj(src, dst)
          print(f'Deployed {len(entries)} GARAGE LIFE 0.5 files into /67')
          PY

      - name: Commit game only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 67
          if git diff --cached --quiet; then
            echo 'No changes to publish'
          else
            git commit -m 'Deploy GARAGE LIFE 0.5 at wong.uz/67'
            git push origin HEAD:main
          fi
