name: Recover stalled GARAGE LIFE Pages deployment

on:
  push:
    paths:
      - .github/workflows/garage-pages-recover.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  recover-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/pages/deployments/a39f54c1721b82857683b373071dd49ea8db4b5a"
          echo "Before cancellation:"
          gh api "$endpoint" || true
          gh api --method POST "$endpoint/cancel"
          echo "Cancellation requested."
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            echo "Status check $attempt:"
            gh api "$endpoint" || true
          done
          echo "Automatic branch-based Pages workflow is independently triggered by this commit."
